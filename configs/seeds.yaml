# All randomness in the pipeline derives from these seeds.
teacher_train_seed: 0        # PPO teacher (s1_train_teacher.py --seed)
collect_base_seed: 0         # demo reset keys = split(PRNGKey(0), n_collect)
eval_base_seed: 10000        # held-out eval keys = split(PRNGKey(10000), n_eval)
n_eval: 100                  # evaluation episodes per policy (>= 50 required)
val_base_seed: 20000         # closed-loop validation during student training = split(PRNGKey(20000), n_val)
n_val: 50                    # (disjoint from collection and eval keys; never used for reporting)
student_train_seeds: [0, 1, 2]   # ACT training seeds (s4_train_act.py --seed)
